
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RentEase</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<nav class="navbar">
    <h2>🏠 RentEase</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="buy.html">Buy</a></li>
        <li><a href="rent.html">Rent</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="signin.html">Sign In</a></li>
        <li><a href="signup.html">Sign Up</a></li>
    </ul>
</nav>

<div class="auth-container">
    <form class="auth-card" id="signupForm">
        <h1>Create Account</h1>
        <p>Join RentEase to explore properties.</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" required
               placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" required
               placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" minlength="8"
               required placeholder="At least 8 characters">

        <label for="role">Account Type</label>
        <select id="role" required>
            <option value="">Select Account Type</option>
            <option value="buyer">Property Buyer</option>
            <option value="renter">Property Renter</option>
            <option value="agent">Property Agent</option>
        </select>

        <button type="submit">Create Account</button>

        <p id="message"></p>

        <p class="switch-link">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </p>
    </form>
</div>

<footer>
    <h3>🏠 RentEase</h3>
    <p>Your trusted property discovery platform.</p>
    <p>© 2026 RentEase. All Rights Reserved.</p>
    <a href="contact.html">Contact Us</a>
</footer>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("message").textContent =
        "Demo only: Connect a backend to save your account.";
});
</script>

</body>
</html>
