
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | RentEase</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<nav class="navbar">
    <h2>🏠 RentEase</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="buy.html">Buy</a></li>
        <li><a href="rent.html">Rent</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="signin.html">Sign In</a></li>
        <li><a href="signup.html">Sign Up</a></li>
    </ul>
</nav>

<div class="auth-container">
    <form class="auth-card" id="signinForm">
        <h1>Welcome Back!</h1>
        <p>Sign in to your RentEase account.</p>

        <label for="email">Email Address</label>
        <input type="email" id="email" required
               placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" required
               placeholder="Enter your password">

        <button type="submit">Sign In</button>

        <p id="message"></p>

        <p class="switch-link">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </form>
</div>

<footer>
    <h3>🏠 RentEase</h3>
    <p>Your trusted property discovery platform.</p>
    <p>© 2026 RentEase. All Rights Reserved.</p>
    <a href="contact.html">Contact Us</a>
</footer>

<script>
document.getElementById("signinForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("message").textContent =
        "Demo only: Connect a backend to verify your account.";
});
</script>

</body>
</html>
